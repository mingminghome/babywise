# Auto-deploy to Cloudflare Pages (Direct Upload) on every push to main.
# Requires GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — API token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — e.g. from `npx wrangler whoami`
#
# Optional build vars (repo Settings → Secrets and variables → Actions → Variables):
#   VITE_GTM_ID             — GTM container (e.g. GTM-XXXXXXX). Empty = no GTM/GA.
#   VITE_BUY_ME_A_PINT_URL  — show “Buy me a pint” chip
#   VITE_BUY_ME_A_PINT_IMG  — optional custom button image
#
# Vite bakes VITE_* into the SPA at `npm run build`. Cloudflare Pages runtime
# env is NOT visible to this Direct Upload build — set the GitHub variables.
#
# AI provider keys (GEMINI_API_KEY, etc.) are Cloudflare Pages secrets only —
# never put them in this workflow or in the SPA bundle.
# Docs: docs/DEPLOY.md, SECURITY.md

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_BUY_ME_A_PINT_URL: ${{ vars.VITE_BUY_ME_A_PINT_URL || 'https://buymeacoffee.com/mingminghomework' }}
          VITE_BUY_ME_A_PINT_IMG: ${{ vars.VITE_BUY_ME_A_PINT_IMG }}
        run: |
          if [ -n "$VITE_GTM_ID" ]; then
            echo "GTM: enabled"
          else
            echo "GTM: disabled (set GitHub Actions variable VITE_GTM_ID, then rebuild)"
          fi
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys dist/ + functions/ → https://babywise.pages.dev
          command: pages deploy dist --project-name=babywise --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
